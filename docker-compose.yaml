services:
  web:
    build:
    command:
    environment:
      DATABASE_URL:
    links:
      - 'database_default'
    ports:
      - '8069:8044'
    volumes:
      - '.:/app:rw'
      - './data:/data:rw'

  database_default:
    image: postgres:15.7-alpine
    environment:
      POSTGRES_DB: 'db'
      POSTGRES_HOST_AUTH_METHOD: 'trust'
      SERVICE_MANAGER: 'fsm-postgres'
    volumes:
      - '.:/app:rw'
      - 'database-default:/var/lib/postgresql/data/'

volumes:
  database-default:
